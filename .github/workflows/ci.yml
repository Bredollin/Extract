name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[gui,dev]"
      - name: Tests (includes real collection on the Windows runner)
        run: pytest -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: End-to-end quick scan
        run: extract-cli scan --quick --output reports/ci

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[gui,dev]"
      - run: pyinstaller packaging/extract.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: Extract-windows
          path: dist/Extract.exe
